name: Play Store UTM Check

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  check-play-store-utm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every Play Store link carries UTM tracking
        run: node scripts/check-play-store-utm.js
